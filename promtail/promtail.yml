server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    pipeline_stages:
      # Bo qua log cu hon 30 phut khi thu thap
      - drop:
          older_than: 30m
          drop_counter_reason: old_log

      # Them nhan de truy van LogQL
      - static_labels:
          job: docker

    relabel_configs:
      # Lay ten container
      - source_labels:
          - __meta_docker_container_name
        regex: '/(.*)'
        target_label: container

      # Lay ten service Docker Compose
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service

      # Lay ten project Docker Compose
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        target_label: project