
# ==========================================
# Prometheus Configuration - Recipe Viet
# Commit 2: Monitoring
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # 1. Prometheus - Giam sat chinh Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # 2. Node Exporter - CPU, RAM, Disk
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. cAdvisor - Docker Container Monitoring
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. MySQL Exporter - Database Monitoring
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # 5. Nginx Exporter - Web Server Monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 6. Telegraf - Docker Container Monitoring
  # Thu thap qua Docker Socket Proxy
  - job_name: 'docker-telegraf'
    scrape_interval: 15s
    static_configs:
      - targets: ['telegraf:9273']
