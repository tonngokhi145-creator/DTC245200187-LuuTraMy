# ==========================================
# Prometheus Configuration - Recipe Viet
# Commit 2: Monitoring
# Commit 3: Alertmanager & Alerting Rules
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ==========================================
# Alertmanager Integration
# ==========================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# ==========================================
# Alerting Rules
# ==========================================
rule_files:
  - '/etc/prometheus/rules/*.yml'

# ==========================================
# Scrape Configurations
# ==========================================
scrape_configs:

  # 1. Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # 2. Node Exporter - CPU, RAM, Disk
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. MySQL Exporter
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # 5. Nginx Exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 6. Docker Telegraf
  - job_name: 'docker-telegraf'
    scrape_interval: 15s
    static_configs:
      - targets: ['telegraf:9273']